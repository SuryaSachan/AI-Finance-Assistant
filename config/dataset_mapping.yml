# ---------------------------------------------------------------------------
# Column mapping from the provided export to the official schema names.
#
# The assistant expects three tables - bank, account, transaction - exactly as
# in the schema document. If the export you are given uses different table or
# column names, override them here; every unlisted name keeps its default.
#
# Workflow:
#   1. python scripts/load_dataset.py --inspect --input path/to/dataset
#        -> prints every file, its table name and its real column names
#   2. adjust the names below
#   3. python scripts/load_dataset.py --input path/to/dataset
#        -> imports, derives counterparty/channel/reconciliation, builds the
#           views, and validates them against app/schema_catalog.py
# ---------------------------------------------------------------------------

transaction:
  table: transaction
  transaction_id: transaction_id
  account_id: account_id
  transaction_date: transaction_date
  transaction_type: transaction_type
  description: description
  transaction_amount: transaction_amount
  transaction_reference_id: transaction_reference_id
  utr_number: utr_number

account:
  table: account
  account_id: account_id
  entity_id: entity_id
  account_number: account_number
  program_id: program_id
  available_balance: available_balance
  bank_code: bank_code

bank:
  table: bank
  bank_code: bank_code
  bank_name: bank_name
