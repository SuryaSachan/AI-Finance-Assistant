# Accuracy benchmark for the Finance Assistant.
#
# Each case pairs a natural-language question with ground-truth SQL that is run
# directly against DuckDB. The assistant passes only if the number it reports
# matches the ground truth (and, where stated, if it picked the right dataset /
# intent / filters).
#
# Placeholders available in expect_sql:
#   {anchor} {lm_start} {lm_end} {pm_start} {pm_end} {ytd_start} {year}

- id: q01
  question: How much did we spend on vendor payouts last month?
  dataset: vendor_payouts
  intent: aggregate
  check: value
  expect_sql: >
    SELECT sum(amount) FROM v_vendor_payouts
    WHERE payout_date BETWEEN DATE '{lm_start}' AND DATE '{lm_end}'

- id: q02
  question: Which transactions are still unreconciled?
  dataset: transactions
  intent: list
  must_filter: [reconciliation_status=unreconciled]
  check: count
  expect_sql: >
    SELECT count(*) FROM v_transactions WHERE reconciliation_status = 'unreconciled'

- id: q03
  question: What was our total spend last month?
  session: s1
  dataset: transactions
  intent: aggregate
  check: value
  expect_sql: >
    SELECT sum(amount) FROM v_transactions
    WHERE direction = 'debit' AND status <> 'void'
      AND txn_date BETWEEN DATE '{lm_start}' AND DATE '{lm_end}'

- id: q04
  question: How does that compare to the month before?
  session: s1
  after: q03
  dataset: transactions
  check: comparison_previous
  expect_sql: >
    SELECT sum(amount) FROM v_transactions
    WHERE direction = 'debit' AND status <> 'void'
      AND txn_date BETWEEN DATE '{pm_start}' AND DATE '{pm_end}'

